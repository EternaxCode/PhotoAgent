# Windows 실행 파일 + 인스톨러 빌드 → 릴리스 업로드
name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the installer to'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller

      - name: Run self-test
        working-directory: windows
        run: python photoagent_win.py --selftest
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

      - name: Build executable (PyInstaller)
        working-directory: windows
        run: |
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          pyinstaller --noconfirm --windowed --name PhotoAgent --icon icon.ico --add-data "icon.png;." photoagent_win.py

      - name: Smoke-test executable
        working-directory: windows
        run: .\dist\PhotoAgent\PhotoAgent.exe --smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        working-directory: windows
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          if (-not $tag) { $tag = $env:REF_NAME }
          gh release upload $tag windows/Output/PhotoAgent-Setup.exe --clobber
